[project]
name = "legal-advisor-api"
version = "2.0.0"
description = "AI-powered legal assistant API for Indian SMBs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.1",

    # Google / LLM
    "google-generativeai>=0.7.1",
    "langchain>=1.0.0",
    "langchain-community>=0.4.0",
    "langchain-core>=1.0.0",
    "langchain-experimental>=0.3.0",
    "langchain-google-genai>=4.0.0",
    "langgraph>=1.0.0",

    # Vector stores
    "langchain-chroma>=1.0.0",
    "chromadb>=0.5.3",
    "langchain-mongodb>=0.2.0",
    "pymongo>=4.7.0",
    "langchain-postgres>=0.0.12",
    "langchain-pinecone>=0.1.3",
    "pinecone-client>=4.0.0",
    "langchain-elasticsearch>=0.2.0",

    # Embeddings / retrieval
    "huggingface-hub>=0.23.4",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.5.0",

    # Documents
    "pypdf>=4.2.0",
    "pdfplumber>=0.11.0",
    "fpdf2>=2.7.0",
    "jinja2>=3.1.0",

    # Web search
    "httpx>=0.27.0",
    "tavily-python>=0.3.0",

    # Evaluation
    "ragas>=0.2.0",
    "datasets>=2.20.0",
    "mlflow>=2.14.1",

    # API layer
    "slowapi>=0.1.9",
    "python-jose[cryptography]>=3.3.0",

    # Auth / webhooks
    "svix>=1.14.0",

    # Database
    "asyncpg>=0.29.0",

    # MCP
    "mcp>=1.0.0",
    "aiosqlite>=0.20.0",

    # Utilities
    "cachetools>=5.3.0",
    "tqdm>=4.66.4",
    "streamlit>=1.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
reranker = [
    "sentence-transformers>=3.0.1",
    "langchain-huggingface>=0.0.3",
    "FlagEmbedding>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
